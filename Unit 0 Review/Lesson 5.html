<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCF3M Unit 0 Lesson 5</title>
    <style>
        :root {
            --primary-color: #0f172a;
            --secondary-color: #2563eb;
            --disabled-color: #94a3b8;
            --text-color: #334155;
            --math-color: #000000;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --border-color: #cbd5e1;
            --highlight-bg: #eff6ff;
            --explanation-bg: #f1f5f9;
            --rule-bg: #fef08a;
            --rule-text: #713f12;
            --success-color: #16a34a;
            --error-color: #dc2626;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.8;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        header {
            background-color: var(--primary-color);
            color: white;
            padding: 40px 20px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: -0.025em;
        }

        .scoreboard {
            background-color: #1e293b;
            color: white;
            display: inline-flex;
            gap: 20px;
            padding: 12px 24px;
            border-radius: 50px;
            font-weight: 700;
            margin-top: 15px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.2);
        }

        .scoreboard span {
            color: #60a5fa;
        }

        .container {
            max-width: 850px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .profile-box, .selector-box {
            background-color: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            border: 1px solid var(--border-color);
            margin-bottom: 25px;
        }

        .profile-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .profile-grid input {
            width: 100%;
            padding: 12px;
            font-size: 1rem;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            box-sizing: border-box;
            outline: none;
        }

        .profile-grid input:focus {
            border-color: var(--secondary-color);
        }

        label {
            display: block;
            font-weight: 700;
            color: var(--primary-color);
            font-size: 1.1rem;
            margin-bottom: 12px;
        }

        select {
            width: 100%;
            padding: 16px;
            font-size: 1.1rem;
            font-family: inherit;
            border-radius: 8px;
            border: 2px solid var(--border-color);
            background-color: white;
            color: var(--primary-color);
            outline: none;
            cursor: pointer;
        }

        .solution-container {
            background-color: var(--card-bg);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            border: 1px solid var(--border-color);
            min-height: 200px;
        }

        .placeholder-text {
            color: #64748b;
            text-align: center;
            font-style: italic;
            padding: 60px 0;
            font-size: 1.1rem;
        }

        .quiz-interface-box {
            background-color: var(--explanation-bg);
            border: 1px solid var(--border-color);
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 30px;
        }

        .fraction-input-wrapper {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            background: white;
            padding: 14px;
            border-radius: 8px;
            border: 2px solid var(--border-color);
            vertical-align: middle;
        }

        .fraction-input-box {
            width: 220px;
            padding: 10px;
            font-size: 1.2rem;
            font-weight: 600;
            text-align: center;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            outline: none;
            color: var(--math-color);
        }

        .fraction-input-box:focus {
            border-color: var(--secondary-color);
            background-color: var(--highlight-bg);
        }

        .fraction-input-bar {
            width: 240px;
            height: 3px;
            background-color: var(--math-color);
            border-radius: 2px;
        }

        .fraction-input-wrapper:has(.fraction-input-box:disabled) {
            background-color: #cbd5e1;
            cursor: not-allowed;
        }

        .fraction-input-box:disabled {
            background-color: transparent;
            border-color: transparent;
        }

        .student-answer-input {
            flex: 1;
            padding: 14px;
            font-size: 1.2rem;
            font-weight: 600;
            border-radius: 8px;
            border: 2px solid var(--border-color);
            outline: none;
            color: var(--math-color);
            background-color: white;
        }

        .student-answer-input:disabled {
            background-color: #cbd5e1;
            color: #475569;
        }

        .math-keyboard-toolbar {
            display: flex;
            gap: 6px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .math-key {
            background-color: white;
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 6px;
            cursor: pointer;
            color: var(--primary-color);
            transition: all 0.15s ease;
        }

        .math-key:hover:not(:disabled) {
            background-color: #e2e8f0;
            border-color: #94a3b8;
        }

        .math-key:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .math-key-active-mode {
            background-color: var(--secondary-color) !important;
            color: white !important;
            border-color: #1d4ed8 !important;
        }

        .feedback-msg-area {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 15px;
            display: none;
            padding: 10px 15px;
            border-radius: 6px;
        }

        .feedback-success {
            background-color: #dcfce7;
            color: var(--success-color);
            border-left: 5px solid var(--success-color);
        }

        .feedback-error {
            background-color: #fee2e2;
            color: var(--error-color);
            border-left: 5px solid var(--error-color);
        }

        .quiz-action-bar {
            display: flex;
            gap: 12px;
        }

        .solution-reveal-window {
            display: none;
            border-top: 3px double var(--border-color);
            margin-top: 30px;
            padding-top: 30px;
        }

        .step-block {
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 1px solid #e2e8f0;
            display: none;
        }

        .step-title {
            font-weight: 800;
            color: var(--secondary-color);
            display: block;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 8px;
        }

        .step-math {
            font-size: 1.3rem;
            font-weight: 700;
            background-color: var(--explanation-bg);
            padding: 14px 20px;
            border-radius: 8px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin: 8px 0;
            color: var(--math-color);
            letter-spacing: 0.02em;
            flex-wrap: wrap;
        }

        .fraction {
            display: inline-flex;
            flex-direction: column;
            vertical-align: middle;
            text-align: center;
            padding: 0 6px;
        }

        .numerator {
            border-bottom: 2px solid var(--math-color);
            padding-bottom: 2px;
        }

        .denominator {
            padding-top: 2px;
        }

        .step-explanation {
            display: block;
            font-size: 1.05rem;
            color: #334155;
            margin-top: 6px;
        }

        .final-answer-box {
            background-color: var(--highlight-bg);
            border-left: 6px solid var(--secondary-color);
            padding: 20px 25px;
            border-radius: 0 8px 8px 0;
            margin-top: 30px;
            display: none;
        }

        .final-answer-label {
            font-weight: 800;
            color: var(--secondary-color);
            display: block;
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .final-answer-math {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--primary-color);
            margin-top: 6px;
            display: inline-flex;
            align-items: center;
            letter-spacing: 0.02em;
        }

        .control-panel {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px solid var(--border-color);
            gap: 15px;
        }

        .btn {
            padding: 14px 24px;
            font-size: 1.05rem;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary { background-color: var(--secondary-color); color: white; }
        .btn-primary:hover:not(:disabled) { background-color: #1d4ed8; }
        .btn-success { background-color: var(--success-color); color: white; }
        .btn-success:hover:not(:disabled) { background-color: #166534; }
        .btn-secondary { background-color: var(--explanation-bg); color: var(--primary-color); border: 1px solid var(--border-color); }
        .btn-secondary:hover:not(:disabled) { background-color: #e2e8f0; }

        .btn:disabled {
            background-color: var(--disabled-color);
            color: #f1f5f9;
            cursor: not-allowed;
            opacity: 0.6;
        }
    </style>
</head>
<body>

    <header>
        <h1>MCF3M Unit 0 Lesson 5</h1>
        <p>Solving Literal Equations (Isolating Variables via SAMDEB Balance)</p>
        <div class="scoreboard">
            <div>Score: <span id="hud-score">0</span></div>
            <div>Tries: <span id="hud-attempts">0</span></div>
        </div>
    </header>

    <div class="container">
       <div class="profile-box">
    <label>Student Profile Setup:</label>
    <div class="profile-grid">
        <input type="text" id="first-name" placeholder="Enter First Name..." autocomplete="off">
        <input type="text" id="last-name" placeholder="Enter Last Name..." autocomplete="off">
    </div>
</div>

        <div class="selector-box">
            <label for="question-select">Homework Question:</label>
            <select id="question-select" onchange="displaySolution()">
                <option value="">-- Click to Select a Question --</option>
                <optgroup label="Literal Equations Evaluation Dataset">
                    <option value="l5q1">Question 1: d = rt (for r)</option>
                    <option value="l5q2">Question 2: P = 144p / y (for p)</option>
                    <option value="l5q3">Question 3: R = CS / d (for C)</option>
                    <option value="l5q4">Question 4: P = a + b + c (for b)</option>
                    <option value="l5q5">Question 5: T = m - n (for n)</option>
                    <option value="l5q6">Question 6: A = (a + b) / 2 (for b)</option>
                    <option value="l5q7">Question 7: V = lwh (for w)</option>
                    <option value="l5q8">Question 8: m = (y₂ - y₁) / (x₂ - x₁) (for y₂)</option>
                    <option value="l5q9">Question 9: ax + by = c (for y)</option>
                    <option value="l5q10">Question 10: A = (a + b + c + d) / 4 (for c)</option>
                    <option value="l5q11">Question 11: S = 2(lw + lh + wh) (for w)</option>
                    <option value="l5q12">Question 12: P = 2(l + w) (for l)</option>
                    <option value="l5q13">Question 13: d = c / π (for π)</option>
                    <option value="l5q14">Question 14: 1 / f = 1 / a + 1 / b (for f)</option>
                    <option value="l5q15">Question 15: A = p(1 + rt) (for t)</option>
                    <option value="l5q16">Question 16: I = prt (for r)</option>
                    <option value="l5q17">Question 17: ax + b = c (for a)</option>
                    <option value="l5q18">Question 18: S = 2πrh (for h)</option>
                    <option value="l5q19">Question 19: A = 2πr² + 2\pi rh (for h)</option>
                    <option value="l5q20">Question 20: y - y₁ = m(x - x₁) (for x)</option>
                    <option value="l5q21">Question 21: R = (l + 3w) / 2 (for w)</option>
                    <option value="l5q22">Question 22: ax + by + c = 0 (for y)</option>
                    <option value="l5q23">Question 23: C = 5/9(F - 32) (for F)</option>
                </optgroup>
            </select>
        </div>

        <div class="solution-container" id="display-window">
            <div id="placeholder" class="placeholder-text">
                Select a homework question from the list above to initialize the test dashboard.
            </div>

            <div id="quiz-station" class="quiz-interface-box" style="display: none;">
                <div id="input-prompt-math-box" style="font-size:1.3rem; font-weight:700; color:var(--primary-color); margin-bottom:16px; display:flex; align-items:center; gap:8px;"></div>
                
                <div id="dynamic-input-mount-point" style="margin-bottom: 20px;"></div>

                <div class="math-keyboard-toolbar" id="math-keyboard">
                    <button class="math-key" id="vkey-frac" onclick="handleFractionUiToggle()" style="background-color:#eff6ff; border-color:#94a3b8; color:var(--secondary-color);">Fraction Mode</button>
                    <button class="math-key" onclick="pressMathKey('+')">+</button>
                    <button class="math-key" onclick="pressMathKey('-')">-</button>
                    <button class="math-key" onclick="pressMathKey('(')">(</button>
                    <button class="math-key" onclick="pressMathKey(')')">)</button>
                    
                    <button class="math-key" id="vkey-d" onclick="pressMathKey('d')">d</button>
                    <button class="math-key" id="vkey-r" onclick="pressMathKey('r')">r</button>
                    <button class="math-key" id="vkey-t" onclick="pressMathKey('t')">t</button>
                    <button class="math-key" id="vkey-P" onclick="pressMathKey('P')">P</button>
                    <button class="math-key" id="vkey-p" onclick="pressMathKey('p')">p</button>
                    <button class="math-key" id="vkey-y" onclick="pressMathKey('y')">y</button>
                    <button class="math-key" id="vkey-R" onclick="pressMathKey('R')">R</button>
                    <button class="math-key" id="vkey-C" onclick="pressMathKey('C')">C</button>
                    <button class="math-key" id="vkey-S" onclick="pressMathKey('S')">S</button>
                    <button class="math-key" id="vkey-a" onclick="pressMathKey('a')">a</button>
                    <button class="math-key" id="vkey-b" onclick="pressMathKey('b')">b</button>
                    <button class="math-key" id="vkey-c" onclick="pressMathKey('c')">c</button>
                    <button class="math-key" id="vkey-m" onclick="pressMathKey('m')">m</button>
                    <button class="math-key" id="vkey-n" onclick="pressMathKey('n')">n</button>
                    <button class="math-key" id="vkey-T" onclick="pressMathKey('T')">T</button>
                    <button class="math-key" id="vkey-A" onclick="pressMathKey('A')">A</button>
                    <button class="math-key" id="vkey-V" onclick="pressMathKey('V')">V</button>
                    <button class="math-key" id="vkey-l" onclick="pressMathKey('l')">l</button>
                    <button class="math-key" id="vkey-w" onclick="pressMathKey('w')">w</button>
                    <button class="math-key" id="vkey-h" onclick="pressMathKey('h')">h</button>
                    <button class="math-key" id="vkey-x" onclick="pressMathKey('x')">x</button>
                    <button class="math-key" id="vkey-y1" onclick="pressMathKey('y1')">y₁</button>
                    <button class="math-key" id="vkey-y2" onclick="pressMathKey('y2')">y₂</button>
                    <button class="math-key" id="vkey-x1" onclick="pressMathKey('x1')">x₁</button>
                    <button class="math-key" id="vkey-x2" onclick="pressMathKey('x2')">x₂</button>
                    <button class="math-key" id="vkey-pi" onclick="pressMathKey('π')">π</button>
                    <button class="math-key" id="vkey-f" onclick="pressMathKey('f')">f</button>
                    <button class="math-key" id="vkey-I" onclick="pressMathKey('I')">I</button>
                    <button class="math-key" id="vkey-F" onclick="pressMathKey('F')">F</button>
                    
                    <button class="math-key" id="vkey-144" onclick="pressMathKey('144')">144</button>
                    <button class="math-key" id="vkey-2" onclick="pressMathKey('2')">2</button>
                    <button class="math-key" id="vkey-4" onclick="pressMathKey('4')">4</button>
                    <button class="math-key" id="vkey-3" onclick="pressMathKey('3')">3</button>
                    <button class="math-key" id="vkey-5" onclick="pressMathKey('5')">5</button>
                    <button class="math-key" id="vkey-9" onclick="pressMathKey('9')">9</button>
                    <button class="math-key" id="vkey-32" onclick="pressMathKey('32')">32</button>
                </div>

                <div id="feedback-msg" class="feedback-msg-area"></div>

                <div class="quiz-action-bar">
                    <button class="btn btn-success" id="check-ans-btn" onclick="evaluateStudentAnswer()">Check Answer</button>
                    <button class="btn btn-secondary" id="reveal-sol-btn" disabled onclick="unlockSolutionPanel()">Show Solution Steps</button>
                </div>
            </div>

            <div class="solution-reveal-window" id="solution-reveal-layer">
                <div id="solution-workspace-injected"></div>
                
                <div class="control-panel" id="controls-panel">
                    <button class="btn btn-secondary" id="restart-btn" onclick="restartSolution()">Restart Steps</button>
                    <button class="btn btn-primary" id="next-btn" onclick="showNextStep()">Next Step &rarr;</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const TEACHER_SPREADSHEET_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwygR6-l7XPRC1KL-Pqci33Yw_4pmCWa8mW7gNHJ_RsmN41ax15-d0sE-CrIxU0z22m/exec";

        // Structured evaluation arrays handle expected layouts and layout permutations
        const answerRegistry = {
            l5q1: { layout: "fraction", num: ["d"], den: ["t"] },
            l5q2: { layout: "fraction", num: ["py", "yp"], den: ["144"] },
            l3q3: { layout: "fraction", num: ["rd", "dr"], den: ["s"] }, // mapping l5q3 mapping registry lookup handler
            l5q3: { layout: "fraction", num: ["rd", "dr"], den: ["s"] },
            l5q4: { layout: "linear", ans: ["p-a-c", "p-c-a", "-a-c+p", "-c-a+p"] },
            l5q5: { layout: "linear", ans: ["m-t", "-t+m"] },
            l5q6: { layout: "linear", ans: ["2a-a", "2*a-a", "-a+2a"] },
            l5q7: { layout: "fraction", num: ["v"], den: ["lh", "hl"] },
            l5q8: { layout: "linear", ans: ["m(x2-x1)+y1", "m*(x2-x1)+y1", "y1+m(x2-x1)"] },
            l5q9: { layout: "fraction", num: ["c-ax", "-ax+c"], den: ["b"] },
            l5q10: { layout: "linear", ans: ["4a-a-b-d", "4*a-a-b-d"] },
            l5q11: { layout: "fraction", num: ["s-2lh", "s-2hl", "-2lh+s"], den: ["2l+2h", "2h+2l"] },
            l4q12: { layout: "fraction", num: ["p-2w", "-2w+p"], den: ["2"] }, // backup duplicate key reference
            l5q12: { layout: "fraction", num: ["p-2w", "-2w+p"], den: ["2"] },
            l5q13: { layout: "fraction", num: ["c"], den: ["d"] },
            l5q14: { layout: "fraction", num: ["ab", "ba"], den: ["a+b", "b+a"] },
            l5q15: { layout: "fraction", num: ["a-p", "-p+a"], den: ["pr", "rp"] },
            l5q16: { layout: "fraction", num: ["i"], den: ["pt", "tp"] },
            l5q17: { layout: "fraction", num: ["c-b", "-b+c"], den: ["x"] },
            l5q18: { layout: "fraction", num: ["s"], den: ["2πr", "2π*r", "2*π*r"] },
            l5q19: { layout: "fraction", num: ["a-2πr2", "a-2πr²"], den: ["2πr", "2π*r"] },
            l5q20: { layout: "fraction", num: ["y-y1+mx1", "y-y1+m*x1"], den: ["m"] },
            l5q21: { layout: "fraction", num: ["2r-l", "-l+2r"], den: ["3"] },
            l5q22: { layout: "fraction", num: ["-ax-c", "-c-ax"], den: ["b"] },
            l5q23: { layout: "linear", ans: ["9c/5+32", "9*c/5+32", "1.8c+32", "1.8*c+32"] }
        };

        const problemDataPack = {
            l5q1: {
                title: "Question 1: d = rt (for r)", target: "r", vars: ["d", "r", "t"],
                prompt: "Solve for r: &nbsp;&nbsp; d = rt &nbsp;&nbsp;&rarr;&nbsp;&nbsp; r =",
                steps: [
                    { title: "Step 1: Check SAMDEB Operations", math: "d = rt", explanation: "Target variable <code>r</code> is within the right term group. There are no outer Subtraction or Addition blocks to balance first. The target is directly bound to <code>t</code> via multiplication." },
                    { title: "Step 2: Apply Multiplication Inverse to Both Sides (Division)", math: "<div class='fraction'><div class='numerator'>d</div><div class='denominator'>t</div></div> = <div class='fraction'><div class='numerator'>rt</div><div class='denominator'>t</div></div> &rarr; <div class='fraction'><div class='numerator'>d</div><div class='denominator'>t</div></div> = r", explanation: "Counter the multiplication of <code>t</code> by dividing both sides of the expression by <code>t</code>. This isolates <code>r</code> cleanly on the right layer." }
                ], ans: "<div class='fraction'><div class='numerator'>d</div><div class='denominator'>t</div></div>"
            },
            l5q2: {
                title: "Question 2: P = 144p / y (for p)", target: "p", vars: ["P", "p", "y", "144"],
                prompt: "Solve for p: &nbsp;&nbsp; P = <div class='fraction'><div class='numerator'>144p</div><div class='denominator'>y</div></div> &nbsp;&nbsp;&rarr;&nbsp;&nbsp; p =",
                steps: [
                    { title: "Step 1: Cancel the Exterior Division Layer (Multiplication Balance)", math: "P &times; y = [ <div class='fraction'><div class='numerator'>144p</div><div class='denominator'>y</div></div> ] &times; y &rarr; Py = 144p", explanation: "The denominator <code>y</code> bounds our target. Counter this global division operation by multiplying both sides by <code>y</code>." },
                    { title: "Step 2: Cancel Multiplication via Division", math: "<div class='fraction'><div class='numerator'>Py</div><div class='denominator'>144</div></div> = <div class='fraction'><div class='numerator'>144p</div><div class='denominator'>144</div></div> &rarr; <div class='fraction'><div class='numerator'>Py</div><div class='denominator'>144</div></div> = p", explanation: "Divide both sides by the constant multiplier <code>144</code> to fully isolate our target variable." }
                ], ans: "<div class='fraction'><div class='numerator'>Py</div><div class='denominator'>144</div></div>"
            },

        let globalScore = 0;
        let globalAttempts = 0;
        let questionStates = {};
        
        Object.keys(problemDataPack).forEach(k => {
            questionStates[k] = { answered: false, activeLayout: "linear", textData: "", numData: "", denData: "", isCorrect: false, currentStep: 0, solRevealed: false };
        });

        let activeQuestionId = "";
        let currentStepIndex = 0;
        let visibleStepElements = [];
        let activeFocusedInputNode = null;

        function displaySolution() {
            const selectMenu = document.getElementById("question-select");
            activeQuestionId = selectMenu.value;

            document.getElementById("solution-reveal-layer").style.display = "none";
            const placeholder = document.getElementById("placeholder");
            const quizStation = document.getElementById("quiz-station");

            if (activeQuestionId === "") {
                placeholder.style.display = "block";
                quizStation.style.display = "none";
                return;
            }

            placeholder.style.display = "none";
            quizStation.style.display = "block";
            
            const activeProblem = problemDataPack[activeQuestionId];
            document.getElementById("input-prompt-math-box").innerHTML = activeProblem.prompt_html || activeProblem.prompt;
            setupVirtualKeyboard(activeProblem);

            const state = questionStates[activeQuestionId];
            renderInjectedInputLayout(state.activeLayout);

            if (state.answered) {
                lockQuizInterface(state.isCorrect);
                if (state.solRevealed) revealSolutionWorkspace();
            } else {
                unlockQuizInterface();
                activeFocusedInputNode.focus();
            }
        }

        function renderInjectedInputLayout(layoutMode) {
            const mountPoint = document.getElementById("dynamic-input-mount-point");
            const state = questionStates[activeQuestionId];
            const fracButton = document.getElementById("vkey-frac");

            if (layoutMode === "fraction") {
                fracButton.classList.add("math-key-active-mode");
                mountPoint.innerHTML = `
                    <div class="fraction-input-wrapper">
                        <input type="text" id="fraction-num-input" class="fraction-input-box" placeholder="Numerator" autocomplete="off">
                        <div class="fraction-input-bar"></div>
                        <input type="text" id="fraction-den-input" class="fraction-input-box" placeholder="Denominator" autocomplete="off">
                    </div>`;
                
                const numNode = document.getElementById("fraction-num-input");
                const denNode = document.getElementById("fraction-den-input");
                
                numNode.value = state.numData;
                denNode.value = state.denData;

                numNode.addEventListener("focus", () => activeFocusedInputNode = numNode);
                denNode.addEventListener("focus", () => activeFocusedInputNode = denNode);
                
                numNode.addEventListener("input", () => state.numData = numNode.value);
                denNode.addEventListener("input", () => state.denData = denNode.value);

                activeFocusedInputNode = numNode;
            } else {
                fracButton.classList.remove("math-key-active-mode");
                mountPoint.innerHTML = `
                    <input type="text" id="linear-text-input" class="student-answer-input" placeholder="e.g., (c-ax)/b or m-T" autocomplete="off" style="width:100%; box-sizing:border-box;">`;
                
                const linNode = document.getElementById("linear-text-input");
                linNode.value = state.textData;
                
                linNode.addEventListener("focus", () => activeFocusedInputNode = linNode);
                linNode.addEventListener("input", () => state.textData = linNode.value);
                
                activeFocusedInputNode = linNode;
            }
        }

        function handleFractionUiToggle() {
            if (!activeQuestionId || questionStates[activeQuestionId].answered) return;
            
            const state = questionStates[activeQuestionId];
            state.activeLayout = (state.activeLayout === "linear") ? "fraction" : "linear";
            
            renderInjectedInputLayout(state.activeLayout);
            activeFocusedInputNode.focus();
        }

        function setupVirtualKeyboard(problem) {
            const allKeys = ["vkey-d", "vkey-r", "vkey-t", "vkey-P", "vkey-p", "vkey-y", "vkey-R", "vkey-C", "vkey-S", "vkey-a", "vkey-b", "vkey-c", "vkey-m", "vkey-n", "vkey-T", "vkey-A", "vkey-V", "vkey-l", "vkey-w", "vkey-h", "vkey-x", "vkey-y1", "vkey-y2", "vkey-x1", "vkey-x2", "vkey-pi", "vkey-f", "vkey-I", "vkey-F", "vkey-144", "vkey-2", "vkey-4", "vkey-3", "vkey-5", "vkey-9", "vkey-32"];
            allKeys.forEach(k => document.getElementById(k).style.display = "none");
            
            problem.vars.forEach(v => {
                const target = "vkey-" + v;
                if (document.getElementById(target)) document.getElementById(target).style.display = "inline-block";
            });
        }

        function pressMathKey(symbol) {
            if (!activeFocusedInputNode || activeFocusedInputNode.disabled) return;
            
            const txtInput = activeFocusedInputNode;
            const startPos = txtInput.selectionStart;
            const endPos = txtInput.selectionEnd;
            let currentText = txtInput.value;
            
            txtInput.value = currentText.substring(0, startPos) + symbol + currentText.substring(endPos, currentText.length);
            txtInput.focus();
            txtInput.selectionStart = startPos + symbol.length;
            txtInput.selectionEnd = startPos + symbol.length;
            
            const state = questionStates[activeQuestionId];
            if (state.activeLayout === "fraction") {
                state.numData = document.getElementById("fraction-num-input").value;
                state.denData = document.getElementById("fraction-den-input").value;
            } else {
                state.textData = document.getElementById("linear-text-input").value;
            }
        }

            if (!activeQuestionId || questionStates[activeQuestionId].answered) return;

            const nameInput = document.getElementById("student-name").value.trim();
            const idInput = document.getElementById("student-id").value.trim();

            if (nameInput === "" || idInput === "") {
                alert("Identity verification required. Please enter your Profile Name and Student ID numbers.");
                return;
            }

            const registryEntry = answerRegistry[activeQuestionId];
            const state = questionStates[activeQuestionId];
            let matchingCorrect = false;
            let logString = "";

            if (state.activeLayout === "fraction") {
                const sNum = state.numData.replace(/\s+/g, '').toLowerCase();
                const sDen = state.denData.replace(/\s+/g, '').toLowerCase();
                logString = sNum + " / " + sDen;
                
                if (registryEntry.layout === "fraction") {
                    if (registryEntry.num.includes(sNum) && registryEntry.den.includes(sDen)) {
                        matchingCorrect = true;
                    }
                }
            } else {
                const sAns = state.textData.replace(/\s+/g, '').toLowerCase();
                logString = sAns;
                
                if (registryEntry.layout === "linear") {
                    if (registryEntry.ans.includes(sAns)) {
                        matchingCorrect = true;
                    }
                } else if (registryEntry.layout === "fraction") {
                    // Check if flat text matches expected fractional parameters via slash parsing
                    const flatExpected = registryEntry.num[0] + "/" + registryEntry.den[0];
                    if (sAns === flatExpected || sAns === "(" + registryEntry.num[0] + ")/" + registryEntry.den[0]) {
                        matchingCorrect = true;
                    }
                }
            }

            state.answered = true;
            state.isCorrect = matchingCorrect;

            globalAttempts++;
            if (matchingCorrect) globalScore++;
            updateHudScoreboard();
            lockQuizInterface(matchingCorrect);

            let payload = {
                unitId: "Unit_0",
                lessonId: "Lesson_5",
                studentName: nameInput,
                studentId: idInput,
                questionId: activeQuestionId,
                userAnswer: logString,
                isCorrect: matchingCorrect,
                attempts: 1,
                methodUsed: "SAMDEB Variable Isolation",
                totalScore: globalScore
            };

            transmitDataToTeacherSpreadsheet(payload);
        }

        function transmitDataToTeacherSpreadsheet(payload) {
            if (TEACHER_SPREADSHEET_SCRIPT_URL === "YOUR_GOOGLE_WEB_APP_URL_HERE") return;
            fetch(TEACHER_SPREADSHEET_SCRIPT_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            }).catch(err => console.error("Tracking database synchronizer crashed:", err));
        }

        function lockQuizInterface(isCorrect) {
            const state = questionStates[activeQuestionId];
            if (state.activeLayout === "fraction") {
                document.getElementById("fraction-num-input").disabled = true;
                document.getElementById("fraction-den-input").disabled = true;
            } else {
                document.getElementById("linear-text-input").disabled = true;
            }
            
            document.querySelectorAll(".math-key").forEach(k => k.disabled = true);
            document.getElementById("check-ans-btn").disabled = true;
            document.getElementById("reveal-sol-btn").disabled = false;

            const feedback = document.getElementById("feedback-msg");
            feedback.style.display = "block";
            if (isCorrect) {
                feedback.className = "feedback-msg-area feedback-success";
                feedback.innerHTML = "Correct entry! Isolation properties verified and logged successfully.";
            } else {
                feedback.className = "feedback-msg-area feedback-error";
                feedback.innerHTML = "Incorrect configuration bounds. Open the SAMDEB steps below to review.";
            }
        }

        function unlockQuizInterface() {
            const state = questionStates[activeQuestionId];
            if (state.activeLayout === "fraction") {
                document.getElementById("fraction-num-input").disabled = false;
                document.getElementById("fraction-den-input").disabled = false;
            } else {
                document.getElementById("linear-text-input").disabled = false;
            }
            
            document.querySelectorAll(".math-key").forEach(k => k.disabled = false);
            document.getElementById("check-ans-btn").disabled = false;
            document.getElementById("reveal-sol-btn").disabled = true;
            document.getElementById("feedback-msg").style.display = "none";
        }

        function unlockSolutionPanel() {
            questionStates[activeQuestionId].solRevealed = true;
            revealSolutionWorkspace();
        }

        function revealSolutionWorkspace() {
            const targetDiv = document.getElementById("solution-reveal-layer");
            const workspace = document.getElementById("solution-workspace-injected");
            const data = problemDataPack[activeQuestionId];
            
            let html = `<h2>Solution Details for ${data.title}</h2>`;
            data.steps.forEach(st => {
                html += `
                <div class="step-block" style="display:none;">
                    <span class="step-title">${st.title}</span>
                    <div class="step-math">${st.math}</div>
                    <span class="step-explanation">${st.explanation}</span>
                </div>`;
            });
            html += `
            <div class="final-answer-box" style="display:none;">
                <span class="final-answer-label">Isolated Target Variable Solution</span>
                <span class="final-answer-math">${data.ans}</span>
            </div>`;

            workspace.innerHTML = html;
            targetDiv.style.display = "block";
            renderMethodSteps();
        }

        function renderMethodSteps() {
            const activeContainer = document.getElementById("solution-workspace-injected");
            visibleStepElements = Array.from(activeContainer.querySelectorAll('.step-block, .final-answer-box'));
            
            currentStepIndex = questionStates[activeQuestionId].currentStep;
            for (let i = 0; i <= currentStepIndex; i++) {
                if (visibleStepElements[i]) visibleStepElements[i].style.display = "block";
            }

            document.getElementById("restart-btn").disabled = (currentStepIndex === 0);
            document.getElementById("next-btn").disabled = (currentStepIndex === visibleStepElements.length - 1);
        }

        function showNextStep() {
            if (currentStepIndex < visibleStepElements.length - 1) {
                currentStepIndex++;
                questionStates[activeQuestionId].currentStep = currentStepIndex;
                visibleStepElements[currentStepIndex].style.display = "block";
                visibleStepElements[currentStepIndex].scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                document.getElementById("restart-btn").disabled = false;
            }
            if (currentStepIndex === visibleStepElements.length - 1) {
                document.getElementById("next-btn").disabled = true;
            }
        }

        function restartSolution() {
            questionStates[activeQuestionId].currentStep = 0;
            revealSolutionWorkspace();
        }

        function updateHudScoreboard() {
            document.getElementById("hud-score").innerText = globalScore;
            document.getElementById("hud-attempts").innerText = globalAttempts;
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCF3M Unit 1 Lesson 1</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>

    <style>
        :root {
            --primary-color: #0f172a;
            --secondary-color: #2563eb;
            --disabled-color: #94a3b8;
            --text-color: #334155;
            --math-color: #000000;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --border-color: #cbd5e1;
            --highlight-bg: #eff6ff;
            --explanation-bg: #f1f5f9;
            --rule-bg: #fef08a;
            --rule-text: #713f12;
            --success-color: #16a34a;
            --error-color: #dc2626;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.8;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        header {
            background-color: var(--primary-color);
            color: white;
            padding: 40px 20px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: -0.025em;
        }

        .scoreboard {
            background-color: #1e293b;
            color: white;
            display: inline-flex;
            gap: 20px;
            padding: 12px 24px;
            border-radius: 50px;
            font-weight: 700;
            margin-top: 15px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.2);
        }

        .scoreboard span {
            color: #60a5fa;
        }

        .container {
            max-width: 850px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .profile-box, .selector-box {
            background-color: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            border: 1px solid var(--border-color);
            margin-bottom: 25px;
        }

        .profile-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .profile-grid input {
            width: 100%;
            padding: 12px;
            font-size: 1rem;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            box-sizing: border-box;
            outline: none;
        }

        .profile-grid input:focus {
            border-color: var(--secondary-color);
        }

        label {
            display: block;
            font-weight: 700;
            color: var(--primary-color);
            font-size: 1.1rem;
            margin-bottom: 12px;
        }

        select {
            width: 100%;
            padding: 16px;
            font-size: 1.1rem;
            font-family: inherit;
            border-radius: 8px;
            border: 2px solid var(--border-color);
            background-color: white;
            color: var(--primary-color);
            outline: none;
            cursor: pointer;
        }

        .solution-container {
            background-color: var(--card-bg);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            border: 1px solid var(--border-color);
            min-height: 200px;
        }

        .placeholder-text {
            color: #64748b;
            text-align: center;
            font-style: italic;
            padding: 60px 0;
            font-size: 1.1rem;
        }

        .quiz-interface-box {
            background-color: var(--explanation-bg);
            border: 1px solid var(--border-color);
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 30px;
        }

        .student-answer-input {
            width: 100%;
            padding: 14px;
            font-size: 1.2rem;
            font-weight: 600;
            border-radius: 8px;
            border: 2px solid var(--border-color);
            outline: none;
            color: var(--math-color);
            box-sizing: border-box;
        }

        .student-answer-input:disabled {
            background-color: #cbd5e1;
            color: #475569;
        }

        .math-render-viewport {
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 24px;
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
        }

        .math-tov {
            border-collapse: collapse;
            font-size: 1.1rem;
            font-weight: 600;
            min-width: 220px;
            text-align: center;
        }

        .math-tov th, .math-tov td {
            border: 2px solid var(--primary-color);
            padding: 10px 20px;
        }

        .math-tov th {
            background-color: #f1f5f9;
            color: var(--primary-color);
            font-weight: 800;
        }

        .mc-options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 10px;
        }

        .mc-option-card {
            background: white;
            border: 2px solid var(--border-color);
            padding: 14px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1.05rem;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .mc-option-card:hover:not(.disabled) {
            border-color: var(--secondary-color);
            background-color: var(--highlight-bg);
        }

        .mc-option-card.selected {
            border-color: var(--secondary-color);
            background-color: #dbeafe;
            color: #1e40af;
        }

        .mc-option-card.disabled {
            cursor: not-allowed;
            opacity: 0.7;
        }

        .mc-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background-color: #e2e8f0;
            color: var(--primary-color);
            font-weight: 800;
            font-size: 0.9rem;
        }

        .mc-option-card.selected .mc-badge {
            background-color: var(--secondary-color);
            color: white;
        }

        .math-keyboard-toolbar {
            display: flex;
            gap: 6px;
            margin-top: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .math-key {
            background-color: white;
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 6px;
            cursor: pointer;
            color: var(--primary-color);
            transition: all 0.15s ease;
        }

        .math-key:hover:not(:disabled) {
            background-color: #e2e8f0;
            border-color: #94a3b8;
        }

        .math-key:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .feedback-msg-area {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 15px;
            display: none;
            padding: 10px 15px;
            border-radius: 6px;
        }

        .feedback-success {
            background-color: #dcfce7;
            color: var(--success-color);
            border-left: 5px solid var(--success-color);
        }

        .feedback-error {
            background-color: #fee2e2;
            color: var(--error-color);
            border-left: 5px solid var(--error-color);
        }

        .quiz-action-bar {
            display: flex;
            gap: 12px;
        }

        .solution-reveal-window {
            display: none;
            border-top: 3px double var(--border-color);
            margin-top: 30px;
            padding-top: 30px;
        }

        .step-block {
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 1px solid #e2e8f0;
            display: none;
        }

        .step-title {
            font-weight: 800;
            color: var(--secondary-color);
            display: block;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 8px;
        }

        .step-math {
            font-size: 1.3rem;
            font-weight: 700;
            background-color: var(--explanation-bg);
            padding: 14px 20px;
            border-radius: 8px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin: 8px 0;
            color: var(--math-color);
            letter-spacing: 0.02em;
            flex-wrap: wrap;
        }

        .step-explanation {
            display: block;
            font-size: 1.05rem;
            color: #334155;
            margin-top: 6px;
        }

        .math-rule {
            background-color: var(--rule-bg);
            color: var(--rule-text);
            padding: 12px 16px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            margin: 10px 0;
            display: block;
            border-left: 4px solid #eab308;
        }

        .final-answer-box {
            background-color: var(--highlight-bg);
            border-left: 6px solid var(--secondary-color);
            padding: 20px 25px;
            border-radius: 0 8px 8px 0;
            margin-top: 30px;
            display: none;
        }

        .final-answer-label {
            font-weight: 800;
            color: var(--secondary-color);
            display: block;
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .final-answer-math {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--primary-color);
            margin-top: 6px;
            display: inline-flex;
            align-items: center;
            letter-spacing: 0.02em;
        }

        .control-panel {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px solid var(--border-color);
            gap: 15px;
        }

        .btn {
            padding: 14px 24px;
            font-size: 1.05rem;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary { background-color: var(--secondary-color); color: white; }
        .btn-primary:hover:not(:disabled) { background-color: #1d4ed8; }
        .btn-success { background-color: var(--success-color); color: white; }
        .btn-success:hover:not(:disabled) { background-color: #166534; }
        .btn-secondary { background-color: var(--explanation-bg); color: var(--primary-color); border: 1px solid var(--border-color); }
        .btn-secondary:hover:not(:disabled) { background-color: #e2e8f0; }

        .btn:disabled {
            background-color: var(--disabled-color);
            color: #f1f5f9;
            cursor: not-allowed;
            opacity: 0.6;
        }
    </style>
</head>
<body>

    <header>
        <h1>MCF3M Unit 1 Lesson 1</h1>
        <p>Identifying Functions & Function Evaluation Studio</p>
        <div class="scoreboard">
            <div>Score: <span id="hud-score">0</span></div>
            <div>Tries: <span id="hud-attempts">0</span></div>
        </div>
    </header>

    <div class="container">
        <div class="profile-box">
            <label>Student Profile Setup:</label>
            <div class="profile-grid">
                <input type="text" id="first-name" placeholder="Enter First Name..." autocomplete="off">
                <input type="text" id="last-name" placeholder="Enter Last Name..." autocomplete="off">
            </div>
        </div>

        <div class="selector-box">
            <label for="question-select">Homework Questions:</label>
            <select id="question-select" onchange="displaySolution()">
                <option value="">-- Click to Select a Question --</option>
                <optgroup label="Part 1: Function Classifications (Tables, Graphs, Sets)">
                    <option value="u1l1q1a">Question 1a: Table a (Circumference)</option>
                    <option value="u1l1q1b">Question 1b: Table b (Perimeter vs Area)</option>
                    <option value="u1l1q1c">Question 1c: Table c (Radius vs Circumference)</option>
                    <option value="u1l1q1d">Question 1d: Table d (Square Root Variations)</option>
                    <option value="u1l1q2">Question 2: Classification Explanations for Question 1</option>
                    <option value="u1l1q3a">Question 3a: Cubic Polynomial Curve Graph</option>
                    <option value="u1l1q3b">Question 3b: Sideways S-Curve Graph</option>
                    <option value="u1l1q3c">Question 3c: Discrete Points Alignments Graph</option>
                    <option value="u1l1q4">Question 4: Geometric Explanations for Question 3</option>
                    <option value="u1l1q5a">Question 5a: Ordered Pairs Set A</option>
                    <option value="u1l1q5b">Question 5b: Ordered Pairs Set B</option>
                    <option value="u1l1q5c">Question 5c: Ordered Pairs Set C</option>
                    <option value="u1l1q6a">Question 6a: Coordinate Plotting for Set 5c</option>
                    <option value="u1l1q6b">Question 6b: Practical Mapping Analysis for Plotting</option>
                    <option value="u1l1q7">Question 7: Linear Relation 3x + 4y = 12</option>
                </optgroup>
                <optgroup label="Part 2: Algebraic & Real-World Evaluation">
                    <option value="u1l1q8a">Question 8a: Evaluate f(4) for f(x) = 6x - 9</option>
                    <option value="u1l1q8b">Question 8b: Evaluate f(-5) for f(x) = 6x - 9</option>
                    <option value="u1l1q8c">Question 8c: Evaluate f(1/2) for f(x) = 6x - 9</option>
                    <option value="u1l1q9a">Question 9a: Evaluate g(-2) for g(x) = x² + 3x + 2</option>
                    <option value="u1l1q9b">Question 9b: Evaluate g(0) for g(x) = x² + 3x + 2</option>
                    <option value="u1l1q9c">Question 9c: Evaluate g(3.14) for g(x) = x² + 3x + 2</option>
                    <option value="u1l1q10a">Question 10a: Contextual Evaluation Meaning of h(2)</option>
                    <option value="u1l1q10b">Question 10b: Quadratic Kinematics Initial Launch Height</option>
                    <option value="u1l1q10c">Question 10c: Kinematics Flight Estimation Methods</option>
                </optgroup>
            </select>
        </div>

        <div class="solution-container" id="display-window">
            <div id="placeholder" class="placeholder-text">
                Select a homework question from the list above to initialize the workbook module.
            </div>

            <div id="quiz-station" class="quiz-interface-box" style="display: none;">
                <div id="asset-viewport-mount-point" class="math-render-viewport" style="display: none;"></div>

                <label id="input-prompt-label" style="margin-bottom: 12px; font-weight: 700; display: block;"></label>
                
                <div id="dynamic-input-mount-point" style="margin-top: 10px;"></div>

                <div class="math-keyboard-toolbar" id="math-keyboard" style="display: none;">
                    <button class="math-key" onclick="pressMathKey('-')">-</button>
                    <button class="math-key" onclick="pressMathKey('.')">.</button>
                </div>

                <div id="feedback-msg" class="feedback-msg-area"></div>

                <div class="quiz-action-bar">
                    <button class="btn btn-success" id="check-ans-btn" onclick="evaluateStudentAnswer()">Check Answer</button>
                    <button class="btn btn-secondary" id="reveal-sol-btn" disabled onclick="unlockSolutionPanel()">Show Solution Steps</button>
                </div>
            </div>

            <div class="solution-reveal-window" id="solution-reveal-layer">
                <div id="solution-workspace-injected"></div>
                
                <div class="control-panel" id="controls-panel">
                    <button class="btn btn-secondary" id="restart-btn" onclick="restartSolution()">Restart Steps</button>
                    <button class="btn btn-primary" id="next-btn" onclick="showNextStep()">Next Step &rarr;</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const TEACHER_SPREADSHEET_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwygR6-l7XPRC1KL-Pqci33Yw_4pmCWa8mW7gNHJ_RsmN41ax15-d0sE-CrIxU0z22m/exec";

        const answerRegistry = {
            u1l1q1a: "A", u1l1q1b: "B", u1l1q1c: "A", u1l1q1d: "B",
            u1l1q2: "A",
            u1l1q3a: "A", u1l1q3b: "B", u1l1q3c: "B",
            u1l1q4: "A",
            u1l1q5a: "A", u1l1q5b: "B", u1l1q5c: "A",
            u1l1q6a: "A", u1l1q6b: "B",
            u1l1q7: "A",
            u1l1q8a: "15", u1l1q8b: "-39", u1l1q8c: "-6",
            u1l1q9a: "0", u1l1q9b: "2", u1l1q9c: "21.2796",
            u1l1q10a: "A", u1l1q10b: "1", u1l1q10c: "A"
        };

        const problemDataPack = {
            u1l1q1a: {
                title: "Question 1a: Table a", type: "mc", assetType: "tov",
                assetHtml: `<table class="math-tov"><tr><th>x</th><th>y</th></tr><tr><td>-2</td><td>0</td></tr><tr><td>-1</td><td>1</td></tr><tr><td>0</td><td>2</td></tr><tr><td>1</td><td>3</td></tr><tr><td>2</td><td>4</td></tr></table>`,
                prompt: "Determine if Table a defines a function relationship:",
                options: ["A) Function - Every unique domain element maps onto exactly one unique range output value.", "B) Not a Function - Independent inputs contain repeating instances pointing to different variables."],
                steps: [
                    { title: "Step 1: Understand What Makes a Function", math: "\\( x \\rightarrow \\text{exactly one } y \\)", explanation: "A relation is only a function if every single input (x-value) points to exactly one output (y-value). Think of it like a vending machine: one specific button should only ever give you one specific snack." },
                    { title: "Step 2: Check the Input Values (x-column)", math: "\\( \\text{Inputs } x = \\{-2, -1, 0, 1, 2\\} \\)", explanation: "Look at the left column: -2, -1, 0, 1, and 2. Notice that none of these numbers repeat. Every input is completely unique." },
                    { title: "Step 3: Conclusion", math: "\\( \\text{Unique Inputs = Valid Function} \\)", explanation: "Because every unique input has exactly one predictable output, this table represents a valid function." }
                ], ans: "A"
            },
            u1l1q1b: {
                title: "Question 1b: Table b", type: "mc", assetType: "tov",
                assetHtml: `<table class="math-tov"><tr><th>Perimeter</th><th>Area</th></tr><tr><td>5</td><td>2</td></tr><tr><td>10</td><td>3</td></tr><tr><td>15</td><td>9</td></tr><tr><td>10</td><td>6</td></tr><tr><td>5</td><td>4</td></tr></table>`,
                prompt: "Determine if Table b defines a function relationship:",
                options: ["A) Function - Tabular matches align within single coordinate blocks.", "B) Not a Function - Specific inputs map onto multiple variant outputs."],
                steps: [
                    { title: "Step 1: Look for Repeated Inputs", math: "\\( \\text{Inputs Sequence} = \\{5, 10, 15, 10, 5\\} \\)", explanation: "Check the left column (Perimeter). You can immediately see that the numbers 5 and 10 appear more than once." },
                    { title: "Step 2: Trace the Outputs", math: "\\( 5 \\rightarrow \\{2, 4\\} \\text{ and } 10 \\rightarrow \\{3, 6\\} \\)", explanation: "Look at where those repeated inputs go. The input 5 points to an area of 2, but later it points to an area of 4. The input 10 points to both 3 and 6." },
                    { title: "Step 3: Conclusion", math: "\\( \\text{One Input, Multiple Outputs} \\neq \\text{Function} \\)", explanation: "Because a single input gives multiple different outputs (like pressing a vending machine button and randomly getting two completely different items), this is not a function." }
                ], ans: "B"
            },
            u1l1q1c: {
                title: "Question 1c: Table c", type: "mc", assetType: "tov",
                assetHtml: `<table class="math-tov"><tr><th>r</th><th>C</th></tr><tr><td>0</td><td>0</td></tr><tr><td>1</td><td>6.28</td></tr><tr><td>2</td><td>12.56</td></tr><tr><td>3</td><td>18.84</td></tr><tr><td>4</td><td>25.12</td></tr></table>`,
                prompt: "Determine if Table c defines a function relationship:",
                options: ["A) Function - Every element maps directly to exactly one unique output value.", "B) Not a Function - Relational tracking implies variations."],
                steps: [
                    { title: "Step 1: Check the Input Values (r-column)", math: "\\( \\text{Inputs } r = \\{0, 1, 2, 3, 4\\} \\)", explanation: "Look at the radius values in the first column: 0, 1, 2, 3, and 4. Every number is perfectly unique and nothing repeats." },
                    { title: "Step 2: Verify the Outputs", math: "\\( \\text{Predictable Mapping} \\)", explanation: "Each unique radius calculates to exactly one specific circumference. There is no confusion or randomly split answers." },
                    { title: "Step 3: Conclusion", math: "\\( \\text{Valid Function} \\)", explanation: "Since every single input matches with exactly one output, this table is a function." }
                ], ans: "A"
            },
            u1l1q1d: {
                title: "Question 1d: Table d", type: "mc", assetType: "tov",
                assetHtml: `<table class="math-tov"><tr><th>x</th><th>y</th></tr><tr><td>0</td><td>0</td></tr><tr><td>1</td><td>2 or -2</td></tr><tr><td>4</td><td>4 or -4</td></tr><tr><td>9</td><td>6 or -6</td></tr><tr><td>16</td><td>8 or -8</td></tr></table>`,
                prompt: "Determine if Table d defines a function relationship:",
                options: ["A) Function - Math parameters stay locked inside real numbers.", "B) Not a Function - Single inputs map onto an alternating set of positive and negative variations."],
                steps: [
                    { title: "Step 1: Look at the Output Column (y-values)", math: "\\( y = \\pm k \\)", explanation: "Notice how the y-column explicitly says 'or'. For example, if you input the number 1, the output could be 2 or it could be -2." },
                    { title: "Step 2: Check the Function Rule", math: "\\( 1 \\rightarrow \\{2, -2\\} \\)", explanation: "A function must have a predictable, single answer for any given input. Having two completely different answers for the same input directly breaks this rule." },
                    { title: "Step 3: Conclusion", math: "\\( \\text{Fails the Function Test} \\)", explanation: "Because one x-value maps to multiple y-values at the exact same time, this is not a function." }
                ], ans: "B"
            },
            u1l2: {
                title: "Question 2", type: "mc", assetType: "none",
                prompt: "For those relations in question 1 that are not functions, explain why:",
                options: ["A) In 1b, inputs 5 and 10 link to multiple areas. In 1d, inputs map to both positive and negative solutions.", "B) Because the table rows are out of chronological order.", "C) Because the variables contain zero parameters."],
                steps: [
                    { title: "Step 1: Why Table 1b Fails", math: "\\( 5 \\rightarrow \\{2, 4\\} \\)", explanation: "In Table 1b, the inputs 5 and 10 repeat and give completely different answers each time." },
                    { title: "Step 2: Why Table 1d Fails", math: "\\( x = 1 \\rightarrow y = 2 \\text{ or } -2 \\)", explanation: "In Table 1d, single inputs like 1, 4, and 9 literally offer two different answers (positive or negative) right there in the box." },
                    { title: "Step 3: The Golden Rule of Functions", math: "\\( \\text{One Input} \\rightarrow \\text{One Output} \\)", explanation: "Both fail because they violate the one-to-one rule: you can never have one input branching out into multiple different outputs." }
                ], ans: "A"
            },
            u1l1q3a: {

        function renderMathElements() {
            if (window.renderMathInElement) {
                renderMathInElement(document.body, {
                    delimiters: [
                        {left: '$$', right: '$$', display: true},
                        {left: '\\(', right: '\\)', display: false}
                    ],
                    throwOnError: false
                });
            }
        }

        window.onload = renderMathElements;

        function displaySolution() {
            const selectMenu = document.getElementById("question-select");
            activeQuestionId = selectMenu.value;

            document.getElementById("solution-reveal-layer").style.display = "none";
            const placeholder = document.getElementById("placeholder");
            const quizStation = document.getElementById("quiz-station");
            const assetMount = document.getElementById("asset-viewport-mount-point");
            const mountPoint = document.getElementById("dynamic-input-mount-point");
            const kbdToolbar = document.getElementById("math-keyboard");
            const promptLabel = document.getElementById("input-prompt-label");

            if (activeQuestionId === "") {
                placeholder.style.display = "block";
                quizStation.style.display = "none";
                assetMount.style.display = "none";
                return;
            }

            placeholder.style.display = "none";
            quizStation.style.display = "block";
            
            const activeProblem = problemDataPack[activeQuestionId];
            const state = questionStates[activeQuestionId];

            if (activeProblem.assetType && activeProblem.assetType !== "none") {
                assetMount.style.display = "flex";
                assetMount.innerHTML = activeProblem.assetHtml;
            } else {
                assetMount.style.display = "none";
            }

            if (activeProblem.type === "mc") {
                if(kbdToolbar) kbdToolbar.style.display = "none";
                promptLabel.innerHTML = activeProblem.prompt;
                
                let html = `<div class="mc-options-list">`;
                activeProblem.options.forEach(opt => {
                    const letter = opt.charAt(0);
                    const isSelected = state.selectedMcOption === letter ? "selected" : "";
                    const isDisabled = state.answered ? "disabled" : "";
                    html += `
                        <div class="mc-option-card ${isSelected} ${isDisabled}" onclick="selectMcOptionCard('${letter}')">
                            <span class="mc-badge">${letter}</span>
                            <span>${opt.substring(3)}</span>
                        </div>`;
                });
                html += `</div>`;
                mountPoint.innerHTML = html;
            } else {
                if(kbdToolbar) kbdToolbar.style.display = "flex";
                promptLabel.innerHTML = activeProblem.prompt || "Type the numeric calculated value:";
                mountPoint.innerHTML = `
                    <input type="text" id="numeric-student-input" class="student-answer-input" placeholder="e.g., 15, -39, 21.2796" autocomplete="off">`;
                
                const numInput = document.getElementById("numeric-student-input");
                numInput.value = state.textInputVal;
                
                numInput.addEventListener("input", () => {
                    state.textInputVal = numInput.value;
                });

                if (state.answered) {
                    numInput.disabled = true;
                }
            }

            if (state.answered) {
                lockQuizInterface(state.isCorrect);
                if (state.solRevealed) revealSolutionWorkspace();
            } else {
                unlockQuizInterface();
            }

            renderMathElements();
        }

        function selectMcOptionCard(letter) {
            if (!activeQuestionId || questionStates[activeQuestionId].answered) return;
            
            questionStates[activeQuestionId].selectedMcOption = letter;
            
            const activeProblem = problemDataPack[activeQuestionId];
            const mountPoint = document.getElementById("dynamic-input-mount-point");
            
            let html = `<div class="mc-options-list">`;
            activeProblem.options.forEach(opt => {
                const currentLetter = opt.charAt(0);
                const isSelected = currentLetter === letter ? "selected" : "";
                html += `
                    <div class="mc-option-card ${isSelected}" onclick="selectMcOptionCard('${currentLetter}')">
                        <span class="mc-badge">${currentLetter}</span>
                        <span>${opt.substring(3)}</span>
                    </div>`;
            });
            html += `</div>`;
            mountPoint.innerHTML = html;
        }

        function pressMathKey(symbol) {
            const txtInput = document.getElementById("numeric-student-input");
            if (!txtInput || txtInput.disabled) return;
            const startPos = txtInput.selectionStart;
            const endPos = txtInput.selectionEnd;
            let currentText = txtInput.value;
            
            txtInput.value = currentText.substring(0, startPos) + symbol + currentText.substring(endPos, currentText.length);
            txtInput.focus();
            txtInput.selectionStart = startPos + symbol.length;
            txtInput.selectionEnd = startPos + symbol.length;
            
            questionStates[activeQuestionId].textInputVal = txtInput.value;
        }

        function evaluateStudentAnswer() {
            if (!activeQuestionId || questionStates[activeQuestionId].answered) return;

            const firstNameInput = document.getElementById("first-name").value.trim();
            const lastNameInput = document.getElementById("last-name").value.trim();

            if (firstNameInput === "" || lastNameInput === "") {
                alert("Identity verification required. Please enter your First Name and Last Name.");
                return;
            }

            const activeProblem = problemDataPack[activeQuestionId];
            const state = questionStates[activeQuestionId];
            let matchingCorrect = false;
            let logString = "";

            if (activeProblem.type === "mc") {
                if (state.selectedMcOption === "") {
                    alert("Please select an option card before verifying your submission.");
                    return;
                }
                logString = "Option " + state.selectedMcOption;
                if (state.selectedMcOption === answerRegistry[activeQuestionId]) {
                    matchingCorrect = true;
                }
            } else {
                const rawVal = state.textInputVal;
                let normalizedInput = rawVal.replace(/\s+/g, '').toLowerCase();
                logString = rawVal;
                
                if (normalizedInput === answerRegistry[activeQuestionId]) {
                    matchingCorrect = true;
                }
            }

            state.answered = true;
            state.isCorrect = matchingCorrect;

            globalAttempts++;
            if (matchingCorrect) globalScore++;
            updateHudScoreboard();
            lockQuizInterface(matchingCorrect);

            let payload = {
                unitId: "Unit_1",
                lessonId: "Lesson_1",
                firstName: firstNameInput,
                lastName: lastNameInput,
                questionId: activeQuestionId,
                userAnswer: logString,
                isCorrect: matchingCorrect,
                attempts: 1,
                methodUsed: activeProblem.type === "mc" ? "Multiple Choice Rows Selection" : "Direct Keyboard Value Input",
                totalScore: globalScore
            };

            transmitDataToTeacherSpreadsheet(payload);
        }

        function transmitDataToTeacherSpreadsheet(payload) {
            fetch(TEACHER_SPREADSHEET_SCRIPT_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            }).catch(err => console.error("Database cloud logging failure:", err));
        }

        function lockQuizInterface(isCorrect) {
            const activeProblem = problemDataPack[activeQuestionId];
            if (activeProblem.type === "mc") {
                document.querySelectorAll(".mc-option-card").forEach(c => c.classList.add("disabled"));
            } else {
                const numInput = document.getElementById("numeric-student-input");
                if (numInput) numInput.disabled = true;
            }
            
            document.querySelectorAll(".math-key").forEach(k => k.disabled = true);
            document.getElementById("check-ans-btn").disabled = true;
            document.getElementById("reveal-sol-btn").disabled = false;

            const feedback = document.getElementById("feedback-msg");
            feedback.style.display = "block";
            if (isCorrect) {
                feedback.className = "feedback-msg-area feedback-success";
                feedback.innerHTML = "Correct entry! Classification parameters safely logged.";
            } else {
                feedback.className = "feedback-msg-area feedback-error";
                feedback.innerHTML = "Incorrect configuration values. Review step modules below.";
            }
        }

        function unlockQuizInterface() {
            document.querySelectorAll(".math-key").forEach(k => k.disabled = false);
            document.getElementById("check-ans-btn").disabled = false;
            document.getElementById("reveal-sol-btn").disabled = true;
            document.getElementById("feedback-msg").style.display = "none";
        }

        function unlockSolutionPanel() {
            questionStates[activeQuestionId].solRevealed = true;
            revealSolutionWorkspace();
        }

        function revealSolutionWorkspace() {
            const targetDiv = document.getElementById("solution-reveal-layer");
            const workspace = document.getElementById("solution-workspace-injected");
            const data = problemDataPack[activeQuestionId];
            
            let html = `<h2>Solution Details for ${data.title}</h2>`;
            data.steps.forEach(step => {
                html += `
                <div class="step-block" style="display:none;">
                    <span class="step-title">${step.title}</span>
                    <div class="step-math">${step.math}</div>
                    <span class="step-explanation">${step.explanation}</span>
                </div>`;
            });
            html += `
            <div class="final-answer-box" style="display:none;">
                <span class="final-answer-label">Official Textbook Solution Reference</span>
                <span class="final-answer-math">${data.ans || data.ans_box}</span>
            </div>`;

            workspace.innerHTML = html;
            targetDiv.style.display = "block";
            renderMethodSteps();
            renderMathElements();
        }

        function renderMethodSteps() {
            const activeContainer = document.getElementById("solution-workspace-injected");
            visibleStepElements = Array.from(activeContainer.querySelectorAll('.step-block, .final-answer-box'));
            
            currentStepIndex = questionStates[activeQuestionId].currentStep;
            for (let i = 0; i <= currentStepIndex; i++) {
                if (visibleStepElements[i]) visibleStepElements[i].style.display = "block";
            }

            document.getElementById("restart-btn").disabled = (currentStepIndex === 0);
            document.getElementById("next-btn").disabled = (currentStepIndex === visibleStepElements.length - 1);
        }

        function showNextStep() {
            if (currentStepIndex < visibleStepElements.length - 1) {
                currentStepIndex++;
                questionStates[activeQuestionId].currentStep = currentStepIndex;
                visibleStepElements[currentStepIndex].style.display = "block";
                visibleStepElements[currentStepIndex].scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                document.getElementById("restart-btn").disabled = false;
            }
            if (currentStepIndex === visibleStepElements.length - 1) {
                document.getElementById("next-btn").disabled = true;
            }
            renderMathElements();
        }

        function restartSolution() {
            questionStates[activeQuestionId].currentStep = 0;
            revealSolutionWorkspace();
        }

        function updateHudScoreboard() {
            document.getElementById("hud-score").innerText = globalScore;
            document.getElementById("hud-attempts").innerText = globalAttempts;
        }
    </script>
</body>
</html>
